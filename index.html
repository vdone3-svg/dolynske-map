<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Карта ділянок — ТОВ Долинське</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111}
#app{display:flex;flex-direction:column;height:100vh}
.tabs{display:flex;background:#1a1a1a;border-bottom:2px solid #2d4a2d;flex-shrink:0}
.tab{padding:10px 22px;color:#aaa;font-size:13px;font-weight:600;cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;user-select:none}
.tab:hover{color:#fff;background:#222}
.tab.active{color:#4caf50;border-bottom-color:#4caf50;background:#111}
.panel{display:none;flex:1;overflow:auto}
.panel.active{display:flex;flex-direction:column}
#map{flex:1;min-height:0}
.map-info{position:absolute;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(15,25,15,.95);padding:7px 16px;border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.5);z-index:1000;font-size:13px;
  font-weight:600;color:#8dcc8d;pointer-events:none;white-space:nowrap}
.legend{position:absolute;bottom:28px;right:10px;
  background:rgba(15,25,15,.95);padding:10px 14px;border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:1000;font-size:12px;line-height:1.9;color:#ccc}
.li{display:flex;align-items:center;gap:8px}
.lb{width:18px;height:13px;border-radius:3px;flex-shrink:0}
.parcel-label{background:transparent!important;border:none!important;box-shadow:none!important;
  font-size:9px;font-weight:700;color:#fff;text-align:center;
  white-space:nowrap;pointer-events:none;line-height:1.4;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.ex-label{color:#ffb080}
.in-label{color:#88aaff}
.own-label{color:#ffe566}
.field-label{background:transparent!important;border:none!important;box-shadow:none!important;
  font-size:13px;font-weight:900;color:#fff;text-align:center;
  pointer-events:auto;line-height:1.3;cursor:pointer;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
.popup-box{font-size:13px;line-height:1.75;min-width:220px;color:#111}
.popup-box b{font-size:15px;color:#1a3a1a;display:block;margin-bottom:3px}
.badge{display:inline-block;padding:2px 9px;border-radius:5px;font-size:11px;font-weight:700;margin:3px 0}
.b-out2{background:#e84200;color:#fff}.b-in2{background:#0055ee;color:#fff}.b-own{background:#cc8800;color:#fff}

/* STATS */
.stats-panel{padding:20px;color:#eee;background:#111;overflow-y:auto}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;max-width:960px;margin:0 auto 20px}
.stat-card{background:#1e2e1e;border:1.5px solid #2d4a2d;border-radius:12px;padding:16px 20px;position:relative}
.stat-card.gold{background:#2a1e00;border-color:#8a6000}
.stat-card.blue{background:#001830;border-color:#0044cc}
.stat-card.orange{background:#2a1000;border-color:#cc3300}
.stat-num{font-size:32px;font-weight:800;line-height:1;margin-bottom:4px}
.stat-num.g{color:#4caf50}.stat-num.gold{color:#ffcc00}.stat-num.blue{color:#66aaff}.stat-num.orange{color:#ff8855}
.stat-label{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.5px}
.stat-sub{font-size:11px;color:#666;margin-top:4px}
.section-title{font-size:15px;font-weight:700;color:#4caf50;margin:20px 0 10px;
  max-width:960px;margin-left:auto;margin-right:auto}
.fields-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:10px;max-width:960px;margin:0 auto}
.field-card{background:#1a2a1a;border:1.5px solid #2a4a2a;border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s}
.field-card:hover{background:#1e3a1e;border-color:#4caf50;transform:translateY(-2px)}
.field-card-name{font-size:16px;font-weight:800;color:#4caf50;margin-bottom:2px}
.exch-detail{font-size:10px;color:#88aaff;margin-top:2px}
.print-btn{position:absolute;top:10px;left:10px;z-index:1001;
  background:#1a4a1a;border:2px solid #4caf50;border-radius:8px;
  color:#8dcc8d;font-size:13px;font-weight:700;padding:7px 16px;cursor:pointer}
.print-btn:hover{background:#2a6a2a;color:#fff}
.field-overlay{position:absolute;inset:0;z-index:2000;
  background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center}
.field-overlay.hidden{display:none}

/* PRINT OVERLAY */
#print-overlay{display:none;position:fixed;inset:0;z-index:9999;background:#555;flex-direction:column}
#print-overlay.show{display:flex}
.po-toolbar{background:#1a1a1a;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.po-btn{padding:7px 18px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.po-btn-print{background:#1a4a1a;color:#8dcc8d;border:1.5px solid #4caf50}
.po-btn-print:hover{background:#2a6a2a;color:#fff}
.po-btn-close{background:#3a0a0a;color:#ff8888;border:1.5px solid #6a1a1a}
.po-btn-close:hover{background:#5a1a1a}
.po-title{color:#ccc;font-size:14px;font-weight:700;flex:1}
.po-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px;background:#666}
.po-body svg{box-shadow:0 4px 24px rgba(0,0,0,.5);display:block}

@media print{
  #app,#print-overlay .po-toolbar{display:none!important}
  #print-overlay{display:flex!important;background:#fff!important;position:fixed!important;inset:0!important;z-index:99999!important}
  .po-body{padding:0!important;overflow:visible!important;align-items:stretch!important;justify-content:stretch!important;background:#fff!important}
  .po-body svg{width:100vw!important;height:100vh!important;box-shadow:none!important}
  @page{size:auto;margin:0mm}
}
</style>
</head>

</div>

</div>

const OWN_SURNAMES=['куліш','котов','ігнат'];
function isOwn(owner){if(!owner)return false;return OWN_SURNAMES.some(s=>owner.toLowerCase().includes(s));}

// Build lookup maps
const parcelMap={};
mainData.features.forEach(f=>parcelMap[f.properties.short]=f.properties);
theirData.features.forEach(f=>parcelMap[f.properties.short]=f.properties);

// Exchange lookup: short -> exchange info
const exchOurMap={};  // our parcel -> their parcel
const exchTheirMap={}; // their parcel -> our parcel
EXCHANGES.forEach(e=>{
  exchOurMap[e.our]=e.theirs;
  if(!exchTheirMap[e.theirs]) exchTheirMap[e.theirs]=[];
  exchTheirMap[e.theirs].push(e.our);
});

const parcelField={};
FIELDS.forEach(f=>f.shorts.forEach(s=>parcelField[s]=f.name));

// Which field a parcel is in
function fieldOf(short){ return parcelField[short]||null; }

function switchTab(name){
  ['map','stats'].forEach((n,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',n===name);
    document.getElementById('tab-'+n).classList.toggle('active',n===name);
  });
  if(name==='map')setTimeout(()=>mainMap.invalidateSize(),50);
  if(name==='stats')renderStats();
}

// ===== MAP =====
const mainMap=L.map('map');
const satLayer=L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
  {maxZoom:20,subdomains:['mt0','mt1','mt2','mt3'],attribution:'© Google'});
const osmLayer=L.tileLayer('https://{s}.tile.openstreetmap.org/{x}/{y}/{z}.png',
  {maxZoom:19,attribution:'© OpenStreetMap'});
satLayer.addTo(mainMap);
L.control.layers({"🛰 Супутник":satLayer,"🗺 Карта":osmLayer},null,{position:'topright'}).addTo(mainMap);

const labels=[],fieldBounds={};

function getStyle(p){
  if(p.ftype==='exchanged_in')return{color:'#0048cc',weight:2.5,fillColor:'#4488ff',fillOpacity:.45,dashArray:'8 4'};
  if(p.ftype==='exchanged_out')return{color:'#c0390a',weight:2.5,fillColor:'#ff6b2b',fillOpacity:.6};
  if(isOwn(p.owner))return{color:'#aa7700',weight:2,fillColor:'#ffd700',fillOpacity:.65};
  return{color:'#2a8a2a',weight:1.5,fillColor:'#4caf50',fillOpacity:.45};
}

function makePopup(p){
  const isOut=p.ftype==='exchanged_out',isIn=p.ftype==='exchanged_in',own=isOwn(p.owner);
  let badge='',exchInfo='';
  if(isOut){
    badge='<span class="badge b-out2">⇄ Наша → віддана</span>';
    const theirsShort=exchOurMap[p.short];
    if(theirsShort){
      const tf=fieldOf(theirsShort);
      exchInfo=`<div style="font-size:11px;color:#ff8855;margin-top:3px">↗ Натомість обробляємо <b>${theirsShort}</b>${tf?' (поле '+tf+')':''}</div>`;
    }
  } else if(isIn){
    badge='<span class="badge b-in2">⇄ Чужа → ми обробляємо</span>';
    const ourShorts=exchTheirMap[p.short];
    if(ourShorts&&ourShorts.length){
      exchInfo=`<div style="font-size:11px;color:#88aaff;margin-top:3px">↙ Замість наших: <b>${ourShorts.join(', ')}</b>${ourShorts.map(s=>fieldOf(s)).filter(Boolean).length?' (поле '+[...new Set(ourShorts.map(s=>fieldOf(s)).filter(Boolean))].join('/')+')'  :''}</div>`;
    }
  } else if(own){
    badge='<span class="badge b-own">★ Власна</span>';
  }
  const fn=parcelField[p.short];
  const pBtn=fn?`<div style="margin-top:8px"><span onclick="printField('${fn}')" style="display:inline-block;padding:4px 12px;background:#1a4a1a;border:1.5px solid #4caf50;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;color:#8dcc8d">🖨 Карта поля ${fn}</span></div>`:'';
  return `<div class="popup-box"><b>${p.short}</b>${p.owner?`<div style="font-size:12px;color:#333;font-style:italic">👤 ${p.owner}</div>`:''}${fn?`<div style="font-size:11px;color:#555">🌾 Поле: <b>${fn}</b></div>`:''}📐 ${p.area.toFixed(2)} га<br>🔢 ${p.cadnum}<br>${badge}${exchInfo}${pBtn}</div>`;
}

const mainGeoLayer=L.geoJSON(mainData,{
  style:f=>getStyle(f.properties),
  onEachFeature:(f,layer)=>{
    const p=f.properties;
    if(parcelField[p.short]){if(!fieldBounds[parcelField[p.short]])fieldBounds[parcelField[p.short]]=[];fieldBounds[parcelField[p.short]].push([p.center_lat,p.center_lon]);}
    layer.on('click',e=>layer.bindPopup(makePopup(p),{maxWidth:300}).openPopup(e.latlng));
    layer.on('mouseover',()=>layer.setStyle({fillOpacity:.85,weight:3}));
    layer.on('mouseout',()=>mainGeoLayer.resetStyle(layer));
    const cls=p.ftype==='exchanged_out'?'parcel-label ex-label':isOwn(p.owner)?'parcel-label own-label':'parcel-label';
    const icon=L.divIcon({className:cls,html:`<div>${p.ftype==='exchanged_out'?'⇄ ':''} ${p.short}</div>${p.owner?`<div style="font-size:8px;opacity:.9">${p.owner}</div>`:''}<div>${p.area.toFixed(2)}</div>`,iconSize:[110,42],iconAnchor:[55,21]});
    labels.push(L.marker([p.center_lat,p.center_lon],{icon,interactive:false}));
  }
}).addTo(mainMap);

const theirGeoLayer=L.geoJSON(theirData,{
  style:()=>({color:'#0048cc',weight:2.5,fillColor:'#4488ff',fillOpacity:.45,dashArray:'8 4'}),
  onEachFeature:(f,layer)=>{
    const p=f.properties;
    if(parcelField[p.short]){if(!fieldBounds[parcelField[p.short]])fieldBounds[parcelField[p.short]]=[];fieldBounds[parcelField[p.short]].push([p.center_lat,p.center_lon]);}
    layer.on('click',e=>layer.bindPopup(makePopup(p),{maxWidth:300}).openPopup(e.latlng));
    layer.on('mouseover',()=>layer.setStyle({fillOpacity:.8,weight:3.5}));
    layer.on('mouseout',()=>theirGeoLayer.resetStyle(layer));
    const icon=L.divIcon({className:'parcel-label in-label',html:`<div>⇄ ${p.short}</div><div>${p.area.toFixed(2)}</div>`,iconSize:[90,32],iconAnchor:[45,16]});
    labels.push(L.marker([p.center_lat,p.center_lon],{icon,interactive:false}));
  }
}).addTo(mainMap);

FIELDS.forEach(f=>{
  if(!fieldBounds[f.name])return;
  const pts=fieldBounds[f.name];
  const lat=pts.reduce((a,p)=>a+p[0],0)/pts.length;
  const lon=pts.reduce((a,p)=>a+p[1],0)/pts.length;
  const icon=L.divIcon({className:'field-label',html:`<div>${f.name}</div><div style="font-size:10px;font-weight:700;opacity:.85">${f.area.toFixed(0)} га</div>`,iconSize:[150,36],iconAnchor:[75,18]});
  L.marker([lat,lon],{icon,interactive:true,zIndexOffset:500}).on('click',()=>printField(f.name)).addTo(mainMap);
});

function updateLabels(){const z=mainMap.getZoom();labels.forEach(m=>{z>=13?m.addTo(mainMap):mainMap.removeLayer(m);});}
mainMap.on('zoomend',updateLabels);
mainMap.fitBounds(mainGeoLayer.getBounds().extend(theirGeoLayer.getBounds()),{padding:[30,30]});
updateLabels();

// ===== PRINT SELECTOR =====
function openPrintSelector(){
  document.getElementById('field-selector-grid').innerHTML=FIELDS.map(f=>`
    <div onclick="printField('${f.name}');closeOverlay()"
    style="background:#1a3a1a;border:1.5px solid #2a5a2a;border-radius:8px;padding:11px 12px;cursor:pointer;text-align:center"
    onmouseover="this.style.background='#2a5a2a'" onmouseout="this.style.background='#1a3a1a'">
      <div style="font-size:14px;font-weight:800;color:#4caf50">${f.name}</div>
      <div style="font-size:17px;font-weight:900;color:#fff">${f.area.toFixed(2)}</div>
      <div style="font-size:10px;color:#888">га · ${f.shorts.length} діл.</div>
    </div>`).join('');
  document.getElementById('field-overlay').classList.remove('hidden');
}
function closeOverlay(){document.getElementById('field-overlay').classList.add('hidden');}
function closePrintOverlay(){document.getElementById('print-overlay').classList.remove('show');}

// ===== SVG PRINT ENGINE =====

function buildPrintPage(fieldName){
  const field=FIELDS.find(f=>f.name===fieldName);
  if(!field) return null;

  // Розділяємо: exchOurSet = наші ділянки, що ВІДДАЛИ; exchTheirSet = чужі, що ОТРИМАЛИ
  const exchOurSet=new Set(EXCHANGES.map(e=>e.our));
  const exchTheirSet=new Set(EXCHANGES.map(e=>e.theirs));
  const fieldExchanges=new Set(field.exchanges||[]);
  // Ділянки поля: віддані (помаранчеві) та отримані (сині)
  const fieldExchOut=new Set([...fieldExchanges].filter(s=>exchOurSet.has(s)));
  const fieldExchIn=new Set([...fieldExchanges].filter(s=>exchTheirSet.has(s)));

  // Collect features
  const features=[];
  field.shorts.forEach(short=>{
    const mf=mainData.features.find(f=>f.properties.short===short);
    if(mf){features.push(mf);return;}
    const tf=theirData.features.find(f=>f.properties.short===short);
    if(tf) features.push(tf);
  });
  if(!features.length) return null;

  // Bounding box
  let minLon=Infinity,maxLon=-Infinity,minLat=Infinity,maxLat=-Infinity;
  features.forEach(f=>{
    const geom=f.geometry;
    const rings=geom.type==='Polygon'?[geom.coordinates[0]]:geom.coordinates.map(p=>p[0]);
    rings.forEach(ring=>ring.forEach(([lon,lat])=>{
      if(lon<minLon)minLon=lon; if(lon>maxLon)maxLon=lon;
      if(lat<minLat)minLat=lat; if(lat>maxLat)maxLat=lat;
    }));
  });

  const dLon=maxLon-minLon||0.001, dLat=maxLat-minLat||0.001;
  // Approximate: 1 deg lon ≈ 0.63 deg lat at 48°N
  const fieldW=dLon*0.63, fieldH=dLat;
  // If field is wider → landscape; if taller → portrait
  const landscape=fieldW>fieldH;

  // A4 dimensions in px at 96dpi
  const A4L={w:1122,h:794}, A4P={w:794,h:1122};
  const page=landscape?A4L:A4P;
  const pageW=page.w, pageH=page.h;

  // Header: 32px, exchange note: variable, table: auto
  // Map takes the rest — maximize it
  const HEADER_H=34;
  const today=new Date().toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric'});

  // Build exchange description for this field
  const exchLines=[];
  // Наші — ВІДДАЛИ (exchanged_out)
  fieldExchOut.forEach(short=>{
    const theirsShort=exchOurMap[short];
    const area=(parcelMap[short]||{}).area||0;
    if(theirsShort){
      const tf=fieldOf(theirsShort)||'?';
      const tArea=(parcelMap[theirsShort]||{}).area||0;
      exchLines.push(`⇄↑ Ділянка ${short} (${area.toFixed(2)} га) — ВІДДАЛИ сусідам. Натомість обробляємо ${theirsShort} (${tArea.toFixed(2)} га, поле «${tf}»)`);
    }
  });
  // Чужі — ОТРИМАЛИ (exchanged_in)
  fieldExchIn.forEach(short=>{
    const ourShorts=exchTheirMap[short]||[];
    const area=(parcelMap[short]||{}).area||0;
    if(ourShorts.length){
      const flds=[...new Set(ourShorts.map(s=>fieldOf(s)).filter(Boolean))];
      const totalOurArea=ourShorts.reduce((a,s)=>a+((parcelMap[s]||{}).area||0),0);
      exchLines.push(`⇄↓ Ділянка ${short} (${area.toFixed(2)} га) — ОТРИМАЛИ від сусідів. Замість наших ${ourShorts.join('+')} (${totalOurArea.toFixed(2)} га, поле «${flds.join('/')||'?'}»)`);
    }
  });

  const EXCH_H=exchLines.length>0?(14+exchLines.length*16+8):0;

  // Table rows
  const ownParcels=features.filter(f=>isOwn(f.properties.owner));
  const isExchShort=s=>fieldExchOut.has(s)||fieldExchIn.has(s);
  const exchParcels=features.filter(f=>isExchShort(f.properties.short));
  const rentParcels=features.filter(f=>!isOwn(f.properties.owner)&&!isExchShort(f.properties.short));
  const sorted=[...ownParcels,...exchParcels,...rentParcels];

  const ROW_H=15;
  const TABLE_HEADER_H=20;
  const TABLE_FOOTER_H=17;
  const TABLE_H=TABLE_HEADER_H+sorted.length*ROW_H+TABLE_FOOTER_H+4;

  // Map gets the rest
  const MAP_H=pageH-HEADER_H-EXCH_H-TABLE_H;

  // ---- SVG projection ----
  const PAD=20;
  function makeProjection(svgW,svgH){
    const drawW=svgW-2*PAD, drawH=svgH-2*PAD;
    const scaleX=drawW/dLon, scaleY=drawH/dLat;
    const scale=Math.min(scaleX,scaleY);
    const offX=PAD+(drawW-dLon*scale)/2;
    const offY=PAD+(drawH-dLat*scale)/2;
    return (lon,lat)=>[offX+(lon-minLon)*scale, offY+(maxLat-lat)*scale];
  }

  const proj=makeProjection(pageW,MAP_H);

  function ringToPoints(ring){
    return ring.map(([lon,lat])=>proj(lon,lat).join(',')).join(' ');
  }
  function centroid(ring){
    let cx=0,cy=0;
    ring.forEach(([lon,lat])=>{cx+=lon;cy+=lat;});
    return proj(cx/ring.length,cy/ring.length);
  }

  // Colors — правильні на основі ftype + fieldExchOut/In
  function fillColor(p){
    if(fieldExchOut.has(p.short)||p.ftype==='exchanged_out') return '#ffb380'; // помаранчевий: наші — víddali
    if(fieldExchIn.has(p.short)||p.ftype==='exchanged_in') return '#a0c4ff';   // синій: чужі — otrimali
    if(isOwn(p.owner)) return '#ffe57a';
    return '#a8e6a8';
  }
  function strokeColor(p){
    if(fieldExchOut.has(p.short)||p.ftype==='exchanged_out') return '#cc3300';
    if(fieldExchIn.has(p.short)||p.ftype==='exchanged_in') return '#0044cc';
    if(isOwn(p.owner)) return '#996600';
    return '#1a6a1a';
  }

  let svgPolygons='',svgLabels='';
  features.forEach(f=>{
    const p=f.properties;
    const geom=f.geometry;
    const rings=geom.type==='Polygon'?[geom.coordinates[0]]:geom.coordinates.map(poly=>poly[0]);
    const fill=fillColor(p),stroke=strokeColor(p);
    const sdash=fieldExchIn.has(p.short)||p.ftype==='exchanged_in'?'stroke-dasharray="8 4"':'';
    rings.forEach(ring=>{
      svgPolygons+=`<polygon points="${ringToPoints(ring)}" fill="${fill}" stroke="${stroke}" stroke-width="1.8" ${sdash} fill-opacity="0.88"/>`;
    });
    // Label at centroid
    const [cx,cy]=centroid(rings[0]);
    const isExch=fieldExchIn.has(p.short)||p.ftype==='exchanged_in';
    const isExchOut=fieldExchOut.has(p.short)||p.ftype==='exchanged_out';
    const isO=isOwn(p.owner);
    const prefix=isExch?'⇄↓':isExchOut?'⇄↑':isO?'★':'';
    // Font size based on parcel area (more area → bigger text)
    const fsize=Math.min(13,Math.max(8,Math.round(9+(p.area/10))));
    svgLabels+=`<text x="${cx}" y="${cy-3}" text-anchor="middle" font-family="Arial,sans-serif" font-size="${fsize}" font-weight="900" fill="${stroke}" paint-order="stroke" stroke="#fff" stroke-width="2.5">${prefix}${p.short}</text>`;
    svgLabels+=`<text x="${cx}" y="${cy+fsize}" text-anchor="middle" font-family="Arial,sans-serif" font-size="${Math.max(7,fsize-2)}" fill="#222" paint-order="stroke" stroke="#fff" stroke-width="2">${p.area.toFixed(2)}</text>`;
  });

  // Legend (top-right corner of map)
  const legendItems=[
    {fill:'#a8e6a8',stroke:'#1a6a1a',dash:'',label:'Оренда'},
    {fill:'#ffe57a',stroke:'#996600',dash:'',label:'★ Власна'},
    {fill:'#a0c4ff',stroke:'#0044cc',dash:'stroke-dasharray="6 3"',label:'⇄ Обмін (отримали)'},
    {fill:'#ffb380',stroke:'#cc3300',dash:'',label:'⇄ Обмін (віддали)'},
  ];
  let legendSvg='';
  const lgW=135,lgH=legendItems.length*20+10;
  const lgX=pageW-lgW-8,lgY=8;
  legendSvg+=`<rect x="${lgX-4}" y="${lgY-4}" width="${lgW+8}" height="${lgH+4}" fill="rgba(255,255,255,0.92)" rx="5"/>`;
  legendItems.forEach((it,i)=>{
    const lx=lgX,ly=lgY+i*20;
    legendSvg+=`<rect x="${lx}" y="${ly+2}" width="16" height="11" fill="${it.fill}" stroke="${it.stroke}" stroke-width="1.5" ${it.dash} rx="2"/>`;
    legendSvg+=`<text x="${lx+22}" y="${ly+12}" font-family="Arial,sans-serif" font-size="10" fill="#111">${it.label}</text>`;
  });

  // North arrow
  const naSvg=`<text x="${PAD+16}" y="${MAP_H-PAD-4}" font-family="Arial" font-size="12" font-weight="900" fill="#333" text-anchor="middle">↑ N</text>`;
  // Scale
  const kmPerDeg=111.32*Math.cos(48.7*Math.PI/180);
  const totalKm=(dLon*kmPerDeg).toFixed(1);
  const scaleSvg=`<text x="${PAD+2}" y="${MAP_H-6}" font-family="Arial" font-size="8.5" fill="#666">~${totalKm} км по ширині</text>`;

  // ---- HEADER BAR ----
  const ownArea=ownParcels.reduce((a,f)=>a+f.properties.area,0);
  const exchArea=exchParcels.reduce((a,f)=>a+f.properties.area,0);
  const rentArea=rentParcels.reduce((a,f)=>a+f.properties.area,0);

  const headerSvg=`
    <rect x="0" y="0" width="${pageW}" height="${HEADER_H}" fill="#1a4a1a"/>
    <text x="12" y="22" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#fff">🌾 Поле ${fieldName}</text>
    <text x="${pageW-10}" y="13" text-anchor="end" font-family="Arial,sans-serif" font-size="9.5" fill="#b0d4b0">${field.area.toFixed(2)} га · ${field.shorts.length} ділянок</text>
    <text x="${pageW-10}" y="27" text-anchor="end" font-family="Arial,sans-serif" font-size="8.5" fill="#7aaa7a">★ власних: ${ownArea.toFixed(2)} га  ·  ⇄ обмін: ${exchArea.toFixed(2)} га  ·  оренда: ${rentArea.toFixed(2)} га</text>`;

  // ---- EXCHANGE INFO BLOCK ----
  let exchBlockSvg='';
  const exchY=HEADER_H+MAP_H;
  if(exchLines.length>0){
    exchBlockSvg+=`<rect x="0" y="${exchY}" width="${pageW}" height="${EXCH_H}" fill="#f0f4ff"/>`;
    exchBlockSvg+=`<text x="10" y="${exchY+13}" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#0044cc">⇄ Обміни по полю:</text>`;
    exchLines.forEach((line,i)=>{
      exchBlockSvg+=`<text x="16" y="${exchY+13+16*(i+1)}" font-family="Arial,sans-serif" font-size="10" fill="#0033aa">${line}</text>`;
    });
  }

  // ---- TABLE ----
  const colWidths=landscape?[52,55,170,220,78]:[48,52,152,195,72];
  const colX=[0];
  colWidths.forEach((w,i)=>colX.push(colX[i]+w));
  const tableW=colX[colX.length-1];
  const tableX=Math.round((pageW-tableW)/2);
  const tableStartY=HEADER_H+MAP_H+EXCH_H+4;

  let tableSvg=`<g transform="translate(${tableX},${tableStartY})">`;
  tableSvg+=`<rect x="0" y="0" width="${tableW}" height="${TABLE_HEADER_H}" fill="#1a4a1a" rx="2"/>`;
  const headers=['Ділянка','Пл, га','Орендодавець / Власник','Кадастровий номер','Статус'];
  headers.forEach((h,i)=>{
    tableSvg+=`<text x="${colX[i]+colWidths[i]/2}" y="14" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#fff">${h}</text>`;
  });

  sorted.forEach((f,ri)=>{
    const p=f.properties;
    const isE=isExchShort(p.short);
    const isO=isOwn(p.owner);
    const ry=TABLE_HEADER_H+ri*ROW_H;
    const bg=ri%2===0?'#f4faf4':'#fff';
    const statusTxt=isE?'⇄ обмін':isO?'★ власна':'оренда';
    const statusFill=isE?'#0044cc':isO?'#996600':'#1a6a1a';
    tableSvg+=`<rect x="0" y="${ry}" width="${tableW}" height="${ROW_H}" fill="${bg}"/>`;
    tableSvg+=`<line x1="0" y1="${ry+ROW_H}" x2="${tableW}" y2="${ry+ROW_H}" stroke="#e0e8e0" stroke-width="0.5"/>`;
    const dotFill=isE?'#4488ff':isO?'#ffd700':'#4caf50';
    tableSvg+=`<circle cx="${colX[0]+9}" cy="${ry+ROW_H/2}" r="4.5" fill="${dotFill}" stroke="${statusFill}" stroke-width="1"/>`;
    tableSvg+=`<text x="${colX[0]+18}" y="${ry+ROW_H-4}" font-family="Arial,sans-serif" font-size="9.5" font-weight="900" fill="#1a1a1a">${p.short}</text>`;
    tableSvg+=`<text x="${colX[1]+colWidths[1]/2}" y="${ry+ROW_H-4}" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#222">${p.area.toFixed(2)}</text>`;
    const owner=(p.owner||'—').substring(0,25);
    tableSvg+=`<text x="${colX[2]+4}" y="${ry+ROW_H-4}" font-family="Arial,sans-serif" font-size="9" fill="#333">${owner}</text>`;
    tableSvg+=`<text x="${colX[3]+4}" y="${ry+ROW_H-4}" font-family="Arial,sans-serif" font-size="8.5" fill="#555">${p.cadnum||'—'}</text>`;
    tableSvg+=`<text x="${colX[4]+colWidths[4]/2}" y="${ry+ROW_H-4}" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="${statusFill}">${statusTxt}</text>`;
  });

  const footY=TABLE_HEADER_H+sorted.length*ROW_H;
  tableSvg+=`<rect x="0" y="${footY}" width="${tableW}" height="${TABLE_FOOTER_H}" fill="#dff0df"/>`;
  tableSvg+=`<text x="6" y="${footY+12}" font-family="Arial,sans-serif" font-size="9.5" font-weight="700" fill="#1a4a1a">РАЗОМ: ${field.area.toFixed(2)} га  |  ${sorted.length} ділянок</text>`;
  tableSvg+=`<text x="${tableW-6}" y="${footY+12}" text-anchor="end" font-family="Arial,sans-serif" font-size="8.5" fill="#555">Оренда: ${rentArea.toFixed(2)} га  Власних: ${ownArea.toFixed(2)} га  Обмін: ${exchArea.toFixed(2)} га</text>`;
  colX.slice(1,-1).forEach(x=>{
    tableSvg+=`<line x1="${x}" y1="0" x2="${x}" y2="${footY+TABLE_FOOTER_H}" stroke="#ccc" stroke-width="0.6"/>`;
  });
  tableSvg+=`<rect x="0" y="0" width="${tableW}" height="${footY+TABLE_FOOTER_H}" fill="none" stroke="#2a7a2a" stroke-width="1.2" rx="2"/>`;
  tableSvg+='</g>';

  // Footer
  const ftY=pageH-6;
  const footerSvg=`<text x="${pageW/2}" y="${ftY}" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#bbb">ТОВ «Долинське» · Карта ділянок · ${today}</text>`;

  // Map background
  const mapY=HEADER_H;
  const mapBg=`<rect x="0" y="${mapY}" width="${pageW}" height="${MAP_H}" fill="#edf4ed"/>`;
  const mapFrame=`<rect x="0" y="${mapY}" width="${pageW}" height="${MAP_H}" fill="none" stroke="#2a7a2a" stroke-width="1"/>`;
  const divider=`<line x1="0" y1="${exchY}" x2="${pageW}" y2="${exchY}" stroke="#2a7a2a" stroke-width="1.5"/>`;

  const svgContent=`<svg xmlns="http://www.w3.org/2000/svg" width="${pageW}" height="${pageH}" viewBox="0 0 ${pageW} ${pageH}" style="background:#fff;display:block">
  ${headerSvg}
  ${mapBg}
  ${mapFrame}
  <g transform="translate(0,${mapY})">${svgPolygons}${svgLabels}${legendSvg}${naSvg}${scaleSvg}</g>
  ${divider}
  ${exchBlockSvg}
  ${tableSvg}
  ${footerSvg}
</svg>`;

  return {svg:svgContent, landscape, pageW, pageH};
}

function printField(name){
  if(!name){openPrintSelector();return;}
  const result=buildPrintPage(name);
  if(!result){alert('Немає даних для поля '+name);return;}
  document.getElementById('po-title').textContent='Поле '+name+' — '+(result.landscape?'Альбом (A4)':'Портрет (A4)');
  document.getElementById('po-body').innerHTML=result.svg;
  document.getElementById('print-overlay').classList.add('show');
}

// ===== STATS =====
function renderStats(){
  const exchOurSetS=new Set(EXCHANGES.map(e=>e.our));
  const exchTheirSetS=new Set(EXCHANGES.map(e=>e.theirs));

  // Фактична площа = все крім exchanged_out
  let factualArea=0, factualCnt=0;
  mainData.features.forEach(f=>{
    if(f.properties.ftype!=='exchanged_out'){factualArea+=f.properties.area;factualCnt++;}
  });
  theirData.features.forEach(f=>{factualArea+=f.properties.area;factualCnt++;});

  // По договорах (всі наші)
  let declaredArea=0;
  mainData.features.forEach(f=>declaredArea+=f.properties.area);

  let ownArea=0,ownCnt=0;
  mainData.features.forEach(f=>{if(isOwn(f.properties.owner)){ownArea+=f.properties.area;ownCnt++;}});

  let rentArea=0,rentCnt=0;
  mainData.features.forEach(f=>{
    if(!isOwn(f.properties.owner)&&f.properties.ftype!=='exchanged_out'){rentArea+=f.properties.area;rentCnt++;}
  });

  let exchOutArea=0,exchOutCnt=0;
  mainData.features.forEach(f=>{if(f.properties.ftype==='exchanged_out'){exchOutArea+=f.properties.area;exchOutCnt++;}});

  let exchInArea=0,exchInCnt=0;
  theirData.features.forEach(f=>{exchInArea+=f.properties.area;exchInCnt++;});

  const balanceDiff=(exchInArea-exchOutArea).toFixed(2);
  const balanceColor=exchInArea>=exchOutArea?'#88ff88':'#ff8888';

  // Власні по власниках
  const ownNames=['Котов Д.О.','Котов О.Ю.','Кулішенко Ю.О.','Ігнатовська А.П.'];
  const ownByPerson={};
  mainData.features.forEach(f=>{
    if(!isOwn(f.properties.owner)) return;
    const o=f.properties.owner;
    const key=ownNames.find(n=>o.toLowerCase().includes(n.split(' ')[0].toLowerCase()))||o;
    if(!ownByPerson[key]) ownByPerson[key]={cnt:0,area:0};
    ownByPerson[key].cnt++;ownByPerson[key].area+=f.properties.area;
  });

  let html=`<div style="max-width:960px;margin:0 auto">`;

  // --- Головна статистика ---
  html+=`<div class="section-title" style="margin-top:0;padding-top:4px">📐 Загальний земельний банк</div>`;
  html+=`<div class="stat-grid">
    <div class="stat-card" style="border-color:#4caf50;background:#0d1f0d">
      <div class="stat-num g">${factualArea.toFixed(2)}</div>
      <div class="stat-label">га фактично в обробітку</div>
      <div class="stat-sub">${factualCnt} ділянок · 13 полів</div>
      <div style="font-size:10px;color:#666;margin-top:3px">По договорах: ${declaredArea.toFixed(2)} га</div>
    </div>
    <div class="stat-card gold">
      <div class="stat-num gold">${ownArea.toFixed(2)}</div>
      <div class="stat-label">га власних</div>
      <div class="stat-sub">${ownCnt} ділянок · ★</div>
    </div>
    <div class="stat-card">
      <div class="stat-num g">${rentArea.toFixed(2)}</div>
      <div class="stat-label">га в оренді</div>
      <div class="stat-sub">${rentCnt} ділянок</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-num orange">${exchOutArea.toFixed(2)}</div>
      <div class="stat-label">га наших — ВІДДАЛИ</div>
      <div class="stat-sub">${exchOutCnt} ділянок · ⇄↑ не обробляємо</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-num blue">${exchInArea.toFixed(2)}</div>
      <div class="stat-label">га чужих — ОТРИМАЛИ</div>
      <div class="stat-sub">${exchInCnt} ділянок · ⇄↓ обробляємо</div>
    </div>
  </div>
  <div style="margin:8px auto 0;max-width:960px;padding:9px 14px;background:#1a1a0a;border:1.5px solid #666600;border-radius:8px;font-size:12px;color:#cccc88">
    ⚖️ Баланс обміну: віддали <b>${exchOutArea.toFixed(2)} га</b> · отримали <b>${exchInArea.toFixed(2)} га</b> →
    <span style="color:${balanceColor};font-weight:700">${balanceDiff>=0?'+':''}${balanceDiff} га</span>
  </div>`;

  // --- Власні по власниках ---
  html+=`<div class="section-title">★ Власні ділянки — по власниках</div>`;
  html+=`<div class="stat-grid">`;
  Object.entries(ownByPerson).forEach(([name,d])=>{
    html+=`<div class="stat-card gold">
      <div class="stat-num gold">${d.area.toFixed(2)}</div>
      <div class="stat-label">га</div>

  });
  html+=`</div>`;

  // --- Деталі обмінів ---
  html+=`<div class="section-title">⇄ Деталі обмінів</div>`;
  html+=`<div style="background:#1a2030;border:1.5px solid #2a3a60;border-radius:10px;padding:14px 18px;margin-bottom:16px">`;
  EXCHANGES.forEach(e=>{
    const op=parcelMap[e.our]||{};
    const tp=parcelMap[e.theirs]||{};
    const of2=fieldOf(e.our)||'?', tf2=fieldOf(e.theirs)||'?';
    html+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:8px 10px;background:#1e2840;border-radius:7px">
      <div style="background:#2a1000;border:1.5px solid #cc3300;border-radius:5px;padding:4px 10px;min-width:85px;text-align:center">
        <div style="color:#ff8855;font-size:10px">⇄↑ Наша → ВІДДАЛИ</div>
        <div style="color:#fff;font-weight:800;font-size:15px">${e.our}</div>
        <div style="color:#aaa;font-size:10px">${(op.area||0).toFixed(2)} га</div>
        <div style="color:#888;font-size:9px">поле «${of2}»</div>
      </div>
      <div style="color:#88aaff;font-size:22px;font-weight:900">⇄</div>
      <div style="background:#001830;border:1.5px dashed #0044cc;border-radius:5px;padding:4px 10px;min-width:85px;text-align:center">
        <div style="color:#88aaff;font-size:10px">⇄↓ Чужа → ОТРИМАЛИ</div>
        <div style="color:#fff;font-weight:800;font-size:15px">${e.theirs}</div>
        <div style="color:#aaa;font-size:10px">${(tp.area||0).toFixed(2)} га</div>
        <div style="color:#888;font-size:9px">поле «${tf2}»</div>
      </div>
      <div style="color:#aaa;font-size:11px;flex:1;padding-left:4px">${op.owner||''}</div>
    </div>`;
  });
  html+=`</div>`;

  // --- Поля ---
  html+=`<div class="section-title">🌾 Поля — клікни для перегляду / друку</div>`;
  html+=`<div class="fields-grid">`;
  FIELDS.forEach(f=>{
    const ownC=f.shorts.filter(s=>parcelMap[s]&&isOwn(parcelMap[s].owner)).length;
    const exchOutS=f.shorts.filter(s=>parcelMap[s]&&parcelMap[s].ftype==='exchanged_out');
    const exchInS=(f.exchanges||[]).filter(s=>parcelMap[s]&&(parcelMap[s].ftype==='exchanged_in'||exchTheirSetS.has(s)));
    // ПРАВИЛЬНО: exchanged_in вже є в shorts, просто виключаємо exchanged_out
    const factualF=f.shorts.reduce((a,s)=>{
      const p=parcelMap[s];
      return p&&p.ftype!=='exchanged_out'?a+p.area:a;
    },0);
    const hasDiff=Math.abs(factualF-f.area)>0.1;
    const exchDesc=(f.exchanges||[]).map(s=>{
      const op=exchOurMap[s], tp=exchTheirMap[s];
      if(op) return `<span style="color:#ff8855">${s}→${op}</span>`;
      if(tp) return `<span style="color:#88aaff">${tp.join('+')}→${s}</span>`;
      return s;
    }).join(' ');
    html+=`<div class="field-card" onclick="switchTab('map');setTimeout(()=>printField('${f.name}'),200)">
      <div class="field-card-name">${f.name}</div>
      <div>
        <span style="font-size:21px;font-weight:900;color:#${hasDiff?'ff9944':'fff'}">${factualF.toFixed(2)}</span>
        <span style="font-size:11px;color:#888"> га</span>
        ${hasDiff?`<span style="font-size:9px;color:#666"> (дог.:${f.area.toFixed(2)})</span>`:''}
      </div>
      <div style="font-size:11px;color:#666;margin-top:3px">${f.shorts.length} діл.${ownC?` · <span style="color:#ffcc00">★${ownC}</span>`:''}${exchOutS.length?` · <span style="color:#ff8855">⇄↑${exchOutS.length}</span>`:''}${exchInS.length?` · <span style="color:#88aaff">⇄↓${exchInS.length}</span>`:''}</div>
      ${exchDesc?`<div class="exch-detail">${exchDesc}</div>`:''}
      <div style="margin-top:5px;font-size:11px;color:#8dcc8d">🖨 Переглянути / Друкувати</div>
    </div>`;
  });
  html+=`</div></div>`;
  document.getElementById('stats-content').innerHTML=html;
}
</script>
</body>
</html>
